# Detekt configuration for Glyph Dialer.
#
# This is a *reasonable, pragmatic* baseline tuned for a Kotlin + Jetpack Compose
# multi-module Android project. It is intentionally not maximal: rules that fight
# idiomatic Compose / Hilt / coroutines code are relaxed, while genuine smells
# (long methods, complex conditions, swallowed exceptions, magic numbers) stay on.
#
# Run (no module build files are modified — detekt is invoked via the CLI):
#
#   detekt --config config/detekt/detekt.yml --input . \
#          --excludes '**/build/**,**/resources/**,**/*.kts'
#
# Or wire it into a root build later with the detekt Gradle plugin pointing at
# `config = files("config/detekt/detekt.yml")`.

build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  # Allow project-local property keys not known to detekt's own schema.
  excludes: ''

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: true
    licenseTemplateFile: 'license.template'
    licenseTemplateIsRegex: true
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    threshold: 20
  ComplexCondition:
    active: true
    threshold: 4
  CyclomaticComplexMethod:
    active: true
    threshold: 18
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  LongMethod:
    active: true
    threshold: 80
    # Composable functions legitimately get long (nested layout DSL).
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable', 'Inject']
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    ignoreDeprecated: true
    ignoreOverridden: true
  LargeClass:
    active: true
    threshold: 600

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    # No-op GlyphController impls on non-Nothing hardware are legitimately empty.
    ignoreOverridden: true

exceptions:
  active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'NumberFormatException'
      - 'ParseException'
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  ThrowingExceptionsWithoutMessageOrCause:
    active: false
  PrintStackTrace:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    # Compose composables are PascalCase.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  MatchingDeclarationName:
    active: true
  MemberNameEqualsClassName:
    active: false

performance:
  active: true
  SpreadOperator:
    active: false
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  ImplicitDefaultLocale:
    active: true
  LateinitUsage:
    active: false
  UnsafeCallOnNullableType:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  CastToNullableType:
    active: true

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreConstantDeclaration: true
    # Compose layouts are full of dp/sp literals; flagging them is just noise.
    ignoreAnnotated: ['Composable', 'Preview']
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Forbidden FIXME — resolve before merge.'
        value: 'FIXME:'
      - reason: 'Forbidden STOPSHIP — must not ship.'
        value: 'STOPSHIP:'
    # TODO is allowed: the §2 honesty principle uses documented TODOs for
    # genuinely-external work (native libs, OEM AAR, backend URL).
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 3
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  UnusedPrivateProperty:
    active: true
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      - 'androidx.compose.foundation.layout.*'
      - 'androidx.compose.material3.*'
      - 'androidx.compose.runtime.*'
  MandatoryBracesIfStatements:
    active: true
  NewLineAtEndOfFile:
    active: true
  UnnecessaryAbstractClass:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  DataClassContainsFunctions:
    active: false
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Use Timber for logging, not android.util.Log (CONVENTIONS §5).'
        value: 'android.util.Log.d'
      - reason: 'Use Timber for logging, not android.util.Log (CONVENTIONS §5).'
        value: 'android.util.Log.e'
      - reason: 'Use Timber for logging, not android.util.Log (CONVENTIONS §5).'
        value: 'android.util.Log.i'
      - reason: 'Use Timber for logging, not android.util.Log (CONVENTIONS §5).'
        value: 'android.util.Log.w'
      - reason: 'Use Timber for logging, not android.util.Log (CONVENTIONS §5).'
        value: 'android.util.Log.v'
      - reason: 'Do not use println; use Timber (CONVENTIONS §5).'
        value: 'kotlin.io.println'
