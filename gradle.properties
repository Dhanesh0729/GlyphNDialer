# Project-wide Gradle settings.
# JVM args — Compose + KSP builds want headroom.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Parallel + build cache for multi-module speed.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is left OFF for v1: Hilt/KSP plugins have historically
# tripped it. Flip to true once the build is green and you've verified plugins.
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# R8 full mode in release
android.enableR8.fullMode=true
