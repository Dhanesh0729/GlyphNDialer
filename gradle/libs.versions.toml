# =============================================================================
# Version catalog — the SINGLE SOURCE OF TRUTH for dependency versions.
#
# RULE FOR ALL MODULE BUILD FILES: reference libraries/plugins via `libs.*`
# aliases below. Do NOT add raw "group:name:version" coordinates in module
# build files, and do NOT edit this file from parallel generators (merge
# conflicts). If something is genuinely missing, prefer adding it here in one
# place. Aliases use dots in the TOML key, surfaced as `libs.foo.bar`.
# =============================================================================

[versions]
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
coroutines = "1.9.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigationCompose = "2.8.4"
accompanist = "0.36.0"
coil = "2.7.0"
media3 = "1.4.1"
camerax = "1.4.0"
room = "2.6.1"
datastore = "1.1.1"
workmanager = "2.9.1"
libphonenumber = "8.13.50"
kotlinxSerialization = "1.7.3"
kotlinxImmutable = "0.3.8"
ktor = "2.3.12"
streamWebrtc = "1.1.1"
timber = "5.0.1"
desugar = "2.1.2"
lottie = "6.5.2"

# Test
junit4 = "4.13.2"
junitJupiter = "5.11.3"
androidxTestExt = "1.2.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"
turbine = "1.2.0"
mockk = "1.13.13"
truth = "1.4.4"
robolectric = "4.13"
coroutinesTest = "1.9.0"

[libraries]
# --- AndroidX core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
